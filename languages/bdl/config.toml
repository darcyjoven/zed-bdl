name = "Genero BDL"
grammar = "bdl"
path_suffixes = ["4gl", "global"]
line_comments = ["-- "]
tab_size = 4

# `#` 也是 BDL 的行注释（预处理指令行以 # 开头），但把它放进 line_comments
# 会让 Ctrl-/ 产生 `# ` 前缀，而 Genero 更习惯 `-- `。保持只列 `-- `。

brackets = [
    { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]

# BDL 的块注释是 { }，与 VSCode 侧 language-configuration/bdl.json 保持一致。
block_comment = { start = "{", prefix = "", end = "}", tab_size = 4 }

word_characters = ["_", "$"]

# 行级缩进兜底：indents.scm 覆盖语法树可见的块，这里补两类
# 语法树里不容易判定、但人眼一看就知道该缩进的情况。
increase_indent_pattern = "(?i)^\\s*(if|while|for|foreach|case|when|try|catch|input|construct|menu|display|prompt|dialog|declare|prepare)\\b.*$"
decrease_indent_pattern = "(?i)^\\s*(end|else|otherwise)\\b"

# LAYOUT 段的列位置有语义（.per 的屏幕坐标），格式化绝不能动它。
# 这里只是把自动缩进留给 indents.scm，不做额外的前缀修剪。
