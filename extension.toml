id = "4gl-full"
name = "Genero BDL & Form (Full)"
schema_version = 1
version = "0.3.0"
authors = ["darcy <darcy_joven@live.com>"]
description = "Genero BDL (.4gl/.global) and Form (.per) support: syntax highlighting, outline, brackets, indentation, and a full LSP (navigation, hover, diagnostics)."
repository = "https://github.com/darcyjoven/zed-bdl"

# 与轻量 bdl-plugin 共存：那个只提供 grammar，本扩展额外挂 language server。
# 注意：Zed 的 extension id 不能与已发布扩展重复，`4gl-full` 是刻意区分的 id。

[grammars.bdl]
repository = "https://github.com/darcyjoven/tree-sitter-bdl"
rev = "ad54d6437f8580fd1d5c70ffefd35405356c0feb"

[grammars.per]
repository = "https://github.com/darcyjoven/tree-sitter-per"
rev = "f76dab786bd39b354e39d3d1fc53e4a817b6eb7f"

# languages 里写的名字必须与 languages/<dir>/config.toml 的 name 完全一致。
[language_servers.bdl-lsp]
name = "Genero BDL LSP"
languages = ["Genero BDL", "Genero Form"]

# LSP 的 languageId 与 Zed 的语言名不一定相同，这里显式映射。
# bdl-lsp 服务端按这两个 id 选择 grammar（见 internal/parser）。
[language_servers.bdl-lsp.language_ids]
"Genero BDL" = "bdl"
"Genero Form" = "per"

# ---------------------------------------------------------------------------
# Slash command（Agent 面板 `/bdl-…`）：只读短查询，名字必须与
# src/slash.rs 的 SLASH_COMMANDS 一一对应（tests/verify-manifest.py 会静态校验）；
# 写错时编译通过但命令静默不响应。
# 会写盘 / 长任务 / 需要交互输入的操作一律走项目 `.zed/tasks.json` 的 task。

[slash_commands.bdl-env-check]
description = "4gl 环境自检：生效设置、bdl-lsp/tiptop 路径与版本、资料状态"
requires_argument = false

[slash_commands.bdl-link-status]
description = "链接资料状态：链数 / orphan / ambiguous / 缺失文件 / 生成时间 / 局部更新"
requires_argument = false

[slash_commands.bdl-link-chain]
description = "查某个程序所在的链与链内文件（参数：程序代码，可写 模组/代码 或带 .4gl 后缀）"
requires_argument = true

[slash_commands.bdl-schema-status]
description = "字段资料状态：表数 / 列数 / 导入时间 / 来源"
requires_argument = false

[slash_commands.bdl-schema-tables]
description = "列出表清单（可选参数：大小写不敏感子串，支持 ^前缀 与 后缀$；不填=全部）"
requires_argument = false

[slash_commands.bdl-schema-columns]
description = "列出某张表的列（参数：表名）"
requires_argument = true

[slash_commands.bdl-deploy-list]
description = "列出部署目标（tiptop deploy -list）"
requires_argument = false

[slash_commands.bdl-deploy-dry-run]
description = "部署预演，只打印计划（tiptop deploy -dry-run）"
requires_argument = false

[slash_commands.bdl-force-parse]
description = "强制解析当前文件（需服务端 workspace/executeCommand，PLAN Z-P3-2 后可用）"
requires_argument = false

# ---------------------------------------------------------------------------
# capability 声明（Zed 0.205+ 校验；旧版本忽略未知字段，不会导致加载失败）。
#
# 为什么 command 写 "*"：Zed 的 `process::Command` 没有 cwd，扩展必须用
# **绝对路径**调用 tiptop，而 capability 的 command 是精确匹配（或 "*"）。
# 因此用 "*" + 参数形状把范围收窄到 tiptop 的子命令形状。
# 用户若收紧了 `granted_extension_capabilities`，需要放行同样形状。

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["link", "**"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["schema", "**"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["upload", "**"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["download", "**"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["exec", "**"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["deploy", "**"]

# bdl-lsp version / tiptop version（`/bdl-env-check` 探测版本用）
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["version"]

# 运行时自动下载二进制（PLAN Z-P4-1 / Z-P4-2 使用）
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["darcyjoven", "**"]
