name: release

# 打 tag（v*）后自动构建并挂到 GitHub Release：
#
#   zed-bdl-<os>-<arch>.wasm     扩展本体（wasm32-wasip2，Zed 装扩展时用）
#   bdl-lsp-<os>-<arch>.tar.gz   语言服务器
#   tiptop-<os>-<arch>.tar.gz    链接资料采集 + 部署 CLI
#   SHA256SUMS                   校验和
#
# 与 vscode-extension 的 bundle-vsix.yml 同一套思路（tag → 构建 → Release），
# 但**产物形态不同**，原因在 Zed 的扩展模型（查 zed-industries/zed main 源码证实）：
#
#   1. **Zed 扩展不能内置平台二进制**。
#      - `ExtensionManifest` 没有 bin/assets 字段；
#      - 打包只复制白名单（extension.toml / extension.wasm / grammars / themes /
#        languages / snippets …），任意 `bin/` 目录会被丢掉；
#      - wasm 沙箱只 preopen 扩展自己的 work 目录，读不到安装目录；
#      - 官方发布要求明写 "Do not bundle a language server with the extension"。
#      ⇒ 所以本扩展**不**把 bdl-lsp/tiptop 塞进 wasm，而是让扩展在运行时按平台
#        下载（src/download.rs 的 download_file + make_file_executable），
#        跟 Zed 官方扩展（glsl / proto）一个路子。
#
#   2. **Zed 装注册表扩展时下载的是预构建 wasm**，不是现场编译源码
#      （registry CI 用 zed-extension CLI 在发布时 release 编译，打成
#      archive.tar.gz 传 blob store；客户端只下载）。
#      ⇒ 这里仍然出 wasm，是为了让"发布物自包含"：Release 里有扩展本体，
#        也有两个后端二进制，谁都能直接取用。
#
#   3. **两个后端二进制必须跟着扩展的 tag 一起锁版本**。
#      扩展的 `src/download.rs` 会去 bdl-lsp / tiptop 各自的 Release 取二进制；
#      但"扩展版本 ↔ 后端版本"的对应关系没在任何地方记录，出了兼容问题查不出来。
#      ⇒ 本 Release 同时带上两个后端的二进制，并写进 BUILD-INFO.json，
#        扩展也能据此提示"你的后端该升到哪个版本"。
#
# 为什么不用交叉编译：
#   bdl-lsp / tiptop 经 tree-sitter 依赖 C 代码，走 CGO。交叉编译要求目标平台的
#   C 工具链，Linux 上的 gcc 产不出 PE / Mach-O，所以每个目标都在**原生 runner**
#   上构建（与 bdl-lsp / tiptop 自己的 release.yml 保持一致）。
#
# 版本号：
#   扩展版本取 tag 去掉前缀 v（必须与 extension.toml / Cargo.toml 里的 version
#   一致，不一致直接失败）；后端版本由各自仓库的 main.go 读出并注入。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bdl_lsp_ref:
        description: "bdl-lsp 的 ref（分支/tag/sha）。正式发布请填 bdl-lsp 的 tag，如 v0.3.16；留空=main（会漂移）"
        required: false
        default: ""
        type: string
      tiptop_ref:
        description: "tiptop 的 ref（分支/tag/sha）。正式发布请填 tiptop 的 tag，如 v0.1.10；留空=main（会漂移）"
        required: false
        default: ""
        type: string

env:
  GO_VERSION: "1.24"
  BDL_LSP_REPO: darcyjoven/bdl-lsp
  TIPTOP_REPO: darcyjoven/tiptop

permissions:
  contents: write

jobs:
  # ------------------------------------------------ 发布元信息（tag / 版本 / ref）
  prepare:
    name: 校验 tag 并计算版本
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      bdl_lsp_ref: ${{ steps.ref.outputs.bdl_lsp_ref }}
      tiptop_ref: ${{ steps.ref.outputs.tiptop_ref }}
    steps:
      - name: 检出扩展（需要 tag 信息与版本号）
        uses: actions/checkout@v4
        with:
          path: zed-extension
          fetch-depth: 0 # 需要看到 refs/tags/*，默认的浅克隆看不到

      - name: 计算版本（tag → version）
        id: ver
        shell: bash
        working-directory: zed-extension
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # workflow_dispatch 时 ref 可能是分支名；必须显式选中 tag，
          # 否则版本号会变成 main 之类的分支名，发布产物无法追溯。
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::当前 ref '${tag}' 不是 tag。workflow_dispatch 请在 'Use workflow from' 里选中 v* tag（例如 v0.2.0）再运行。"
            exit 1
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::tag 必须以 v 开头（如 v0.2.0），当前为 '${tag}'"; exit 1 ;;
          esac
          version="${tag#v}"
          # tag 名里带 '-'（如 v0.2.0-rc1）即预发布
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      # tag 与清单里的版本必须一致，否则 Release 里的 wasm 与版本号对不上，
      # 装上去之后 "扩展 0.2.0 / 实际 wasm 0.1.1" 这种错最难查。
      - name: 校验 tag 与扩展版本一致
        shell: bash
        working-directory: zed-extension
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          ext_ver=$(python3 -c "import tomllib;print(tomllib.load(open('extension.toml','rb'))['version'])")
          cargo_ver=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          echo "tag 版本=${VERSION}  extension.toml=${ext_ver}  Cargo.toml=${cargo_ver}"
          if [ "$ext_ver" != "$VERSION" ] || [ "$cargo_ver" != "$VERSION" ]; then
            echo "::error::tag 与版本号不一致：先改 extension.toml / Cargo.toml 的 version 再打 tag"
            exit 1
          fi

      # 把实际使用的后端 ref 写进日志与 job summary，避免"以为锁了版本、
      # 实际追 main"这类发布事故被埋没在几百行构建日志里。
      - name: 决定后端实际 ref（显式输入 > 最近 Release tag > main）
        id: ref
        shell: bash
        env:
          BDL_LSP_REF_INPUT: ${{ inputs.bdl_lsp_ref }}
          TIPTOP_REF_INPUT: ${{ inputs.tiptop_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          resolve() {
            input="$1"; repo="$2"
            if [ -n "$input" ]; then echo "$input"; return; fi
            # 没填时优先取该仓库**最近正式 Release 的 tag**，而不是 main：
            # main 会漂移，同一条扩展 tag 隔几天重建会得到不同二进制。
            tag="$(gh release view --repo "$repo" --json tagName --jq .tagName 2>/dev/null || true)"
            if [ -z "$tag" ]; then tag="main"; fi
            echo "$tag"
          }
          lsp_ref="$(resolve "$BDL_LSP_REF_INPUT" "$BDL_LSP_REPO")"
          tools_ref="$(resolve "$TIPTOP_REF_INPUT" "$TIPTOP_REPO")"
          echo "bdl_lsp_ref=${lsp_ref}" >> "$GITHUB_OUTPUT"
          echo "tiptop_ref=${tools_ref}" >> "$GITHUB_OUTPUT"
          echo "bdl-lsp ref: ${lsp_ref}    tiptop ref: ${tools_ref}"
          {
            echo "### 本次发布使用的后端 ref"
            echo
            echo "- bdl-lsp ref: \`${lsp_ref}\`"
            echo "- tiptop ref: \`${tools_ref}\`"
            echo "- 扩展 tag: \`${GITHUB_REF_NAME}\`"
            echo
            if [[ "$lsp_ref" == v* && "$tools_ref" == v* ]]; then
              echo "> 已锁定到两个后端的发布 tag，产物可复现。"
            else
              echo "> :warning: 有后端没取到 Release tag（用了 \`main\` 之类的漂移 ref）。"
              echo "> **正式发布请用 workflow_dispatch 并把 bdl_lsp_ref / tiptop_ref 显式指定为对应 tag**。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------- 扩展 wasm（平台无关）
  # 单独一个 job，不放在四平台矩阵里：
  #   - wasm32-wasip2 的产物**与目标平台无关**（不是 Windows PE、不是 Mach-O），
  #     在四个 runner 上各编一遍纯属浪费（还会在 Windows 上踩 shell 差异的坑）；
  #   - 放 ubuntu 上编，shell 统一是 bash，`xxd`/`head` 都在。
  #
  # 扩展的 wasm 由 Zed 装扩展时自己编译（注册表装的是预构建产物，见
  # crates/extension_cli）；这里出的是**发布物**：让 Release 自包含，
  # 也方便排查"这个版本的扩展到底长什么样"。
  wasm:
    name: 扩展 wasm
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 检出扩展
        uses: actions/checkout@v4
        with:
          path: zed-extension

      # BUILD-INFO.json 要记"本次发布实际用的后端版本"，
      # 所以这个 job 也得把两个后端仓库拉下来（只读 main.go 里的版本号，
      # 不编译 —— 编译在四平台的 build job 里做）。
      #
      # ⚠️ 兄弟目录名必须是 bdl-lsp / tiptop：tiptop 的 go.mod 里有
      #    `replace github.com/darcyjoven/bdl-lsp => ../bdl-lsp`，
      #    相对路径以模块根为基准，目录名错了就 replace 不到。
      - name: 检出 bdl-lsp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BDL_LSP_REPO }}
          ref: ${{ needs.prepare.outputs.bdl_lsp_ref }}
          path: bdl-lsp

      - name: 检出 tiptop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TIPTOP_REPO }}
          ref: ${{ needs.prepare.outputs.tiptop_ref }}
          path: tiptop

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zed-extension/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('zed-extension/Cargo.lock') }}

      - name: 构建 wasm
        working-directory: zed-extension
        shell: bash
        run: |
          set -eux
          cargo build --release --target wasm32-wasip2
          ls -lh target/wasm32-wasip2/release/*.wasm
          # wasm 魔数：\0asm => 0061736d
          magic=$(head -c 4 target/wasm32-wasip2/release/zed_bdl.wasm | xxd -p)
          echo "magic=$magic"
          test "$magic" = "0061736d"

      # BUILD-INFO.json：记下"这个扩展版本该配哪个后端版本"。
      #
      # ★ 它是**平台无关**的一份（放 wasm job 里出），不在四平台 job 里各出一份：
      #   download-artifact 的 merge-multiple 会把同名文件**互相覆盖**，
      #   四份 BUILD-INFO.json 只剩最后一份，"target" 字段也会只剩一个平台 —— 信息丢了。
      #   而 target 本来就写在资产名里（bdl-lsp-linux-amd64.tar.gz），不重复记。
      - name: 写 BUILD-INFO.json
        shell: bash
        working-directory: zed-extension
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BDL_LSP_REF: ${{ needs.prepare.outputs.bdl_lsp_ref }}
          TIPTOP_REF: ${{ needs.prepare.outputs.tiptop_ref }}
        run: |
          set -eux
          LSP_VERSION="$(sed -n 's/^var version = "\(.*\)"/\1/p' ../bdl-lsp/main.go)"
          TOOLS_VERSION="$(sed -n 's/^var version = "\(.*\)"/\1/p' ../tiptop/main.go)"
          test -n "$LSP_VERSION"
          test -n "$TOOLS_VERSION"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT=BUILD-INFO.json
          printf '{\n' > "$OUT"
          printf '  "extensionVersion": "%s",\n' "$VERSION" >> "$OUT"
          printf '  "lspVersion": "%s",\n' "$LSP_VERSION" >> "$OUT"
          printf '  "lspRef": "%s",\n' "$BDL_LSP_REF" >> "$OUT"
          printf '  "tiptopVersion": "%s",\n' "$TOOLS_VERSION" >> "$OUT"
          printf '  "tiptopRef": "%s",\n' "$TIPTOP_REF" >> "$OUT"
          printf '  "builtAt": "%s"\n' "$BUILT_AT" >> "$OUT"
          printf '}\n' >> "$OUT"
          cat "$OUT"
          # 必须是合法 JSON
          python3 -c "import json;json.load(open('$OUT'))"

      # ★ 上传前先把产物**摊到同一个目录**，否则归档内的路径由
      #   upload-artifact 的"最小公共祖先"（LCA）决定：
      #   `zed-extension/target/.../zed_bdl.wasm` + `zed-extension/BUILD-INFO.json`
      #   的 LCA 是 `zed-extension`，于是 wasm 会以
      #   `target/wasm32-wasip2/release/zed_bdl.wasm` 的形态进归档，
      #   下载下来后找不到（2026-10-30 实跑踩过：release job 挂在"整理产物"）。
      #   显式 staging 之后，归档内就是 zed-bdl.wasm + BUILD-INFO.json 两个平铺文件。
      - name: 整理上传内容
        shell: bash
        run: |
          set -eux
          mkdir -p staging
          cp zed-extension/target/wasm32-wasip2/release/zed_bdl.wasm staging/zed-bdl.wasm
          cp zed-extension/BUILD-INFO.json staging/BUILD-INFO.json
          ls -l staging

      - name: 上传 wasm 与 BUILD-INFO.json
        uses: actions/upload-artifact@v4
        with:
          name: zed-bdl-wasm
          path: staging/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------- 四平台构建/打包
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 用 22.04（glibc 2.35）而不是 24.04（2.39），
          # 让产物在更老的发行版上也能跑。
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
          # macos-13 已于 2025-12 退役；macos-15-intel 是 GitHub 最后一个
          # x86_64 镜像（官方承诺支持到 2027-08）。
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          # 与 bdl-lsp / tiptop 的 release.yml 保持同一镜像与 MinGW 安装方式。
          - os: windows
            arch: amd64
            runner: windows-2025

    steps:
      - name: 检出扩展
        uses: actions/checkout@v4
        with:
          path: zed-extension

      # tiptop 的 go.mod 里有 `replace ... => ../bdl-lsp`，
      # 所以两个仓库必须是**同级目录**：bdl-lsp/ 与 tiptop/。
      - name: 检出 bdl-lsp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BDL_LSP_REPO }}
          ref: ${{ needs.prepare.outputs.bdl_lsp_ref }}
          path: bdl-lsp

      - name: 检出 tiptop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TIPTOP_REPO }}
          ref: ${{ needs.prepare.outputs.tiptop_ref }}
          path: tiptop

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            bdl-lsp/go.sum
            tiptop/go.sum

      # Windows 的 CGO 需要 MinGW，且必须屏蔽全局 go env（原因见 bdl-lsp
      # release.yml 的 Windows 一节：别的 SDK 可能把 CC 改写成 clang 并加 --target）。
      - name: 安装 MinGW-w64（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $mingw = 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
          if (-not (Test-Path $mingw)) {
            $gccPath = (Get-Command gcc -ErrorAction SilentlyContinue).Source
            if (-not $gccPath) { throw '找不到 gcc' }
            $mingw = Split-Path -Parent $gccPath
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "MinGW: $mingw"

      # ---------------------------------------------------------------- bdl-lsp
      - name: 构建 bdl-lsp
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eux
          cd bdl-lsp
          LSP_VERSION="$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)"
          test -n "$LSP_VERSION"
          echo "bdl-lsp $LSP_VERSION -> ${{ matrix.os }}/${{ matrix.arch }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            export CC=gcc
          fi

          mkdir -p ../dist
          export CGO_ENABLED=1
          export GOOS='${{ matrix.os }}'
          export GOARCH='${{ matrix.arch }}'

          # -extldflags=-static 让 mingw 把 libwinpthread / libgcc 静态链进来，
          # 否则用户机器上没有 MinGW 时会报 0xc0000135（缺 DLL）且无法启动。
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -trimpath \
              -ldflags "-s -w -X main.version=$LSP_VERSION -linkmode external -extldflags '-static'" \
              -o "../dist/bdl-lsp.exe" .
          else
            go build -trimpath \
              -ldflags "-s -w -X main.version=$LSP_VERSION" \
              -o "../dist/bdl-lsp" .
          fi

      - name: 构建 tiptop
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eux
          cd tiptop
          TOOLS_VERSION="$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)"
          test -n "$TOOLS_VERSION"
          echo "tiptop $TOOLS_VERSION -> ${{ matrix.os }}/${{ matrix.arch }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            export CC=gcc
          fi

          mkdir -p ../dist
          export CGO_ENABLED=1
          export GOOS='${{ matrix.os }}'
          export GOARCH='${{ matrix.arch }}'

          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -trimpath \
              -ldflags "-s -w -X main.version=$TOOLS_VERSION -linkmode external -extldflags '-static'" \
              -o "../dist/tiptop.exe" .
          else
            go build -trimpath \
              -ldflags "-s -w -X main.version=$TOOLS_VERSION" \
              -o "../dist/tiptop" .
          fi

      # 发布前的自检：版本号真的注入了、产物能跑、架构对。
      # 失败必须非零退出，绝不把未注入版本号的二进制发出去。
      - name: 自检（Unix）
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dist
        run: |
          set -eux
          out=$(./bdl-lsp version)
          echo "$out"
          case "$out" in "bdl-lsp "*) ;; *) echo "::error::bdl-lsp version 输出异常：$out"; exit 1;; esac
          out=$(./tiptop version)
          echo "$out"
          case "$out" in "tiptop "*) ;; *) echo "::error::tiptop version 输出异常：$out"; exit 1;; esac
          file bdl-lsp tiptop

      - name: 自检（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          $out = & .\bdl-lsp.exe version
          Write-Host "bdl-lsp -> $out"
          if ($LASTEXITCODE -ne 0) { throw 'bdl-lsp version 子命令失败' }
          if ($out -notlike 'bdl-lsp *') { throw "版本输出异常：$out" }

          $out = & .\tiptop.exe version
          Write-Host "tiptop -> $out"
          if ($LASTEXITCODE -ne 0) { throw 'tiptop version 子命令失败' }
          if ($out -notlike 'tiptop *') { throw "版本输出异常：$out" }

          # 不能有 MinGW 运行库依赖，否则用户机器上启动即 0xc0000135
          if (-not (Get-Command objdump -ErrorAction SilentlyContinue)) { throw '找不到 objdump' }
          $deps = & objdump -p .\bdl-lsp.exe
          if ($LASTEXITCODE -ne 0) { throw 'objdump 执行失败' }
          if ($deps -match 'libwinpthread|libgcc|libstdc') {
            Write-Host $deps
            throw '产物仍依赖 MinGW 运行库（-extldflags=-static 未生效）'
          }

      # 打包：后端二进制沿用 bdl-lsp / tiptop 自己的资产命名
      # （<name>-<os>-<arch>.<ext>），这样扩展的 src/download.rs
      # 能用同一套资产名解析逻辑挑对应平台的资产。
      - name: 打包（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          cd dist
          tar -czf "bdl-lsp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" bdl-lsp
          tar -czf "tiptop-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" tiptop
          tar -tzf "bdl-lsp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -tzf "tiptop-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          Compress-Archive -Path bdl-lsp.exe -DestinationPath bdl-lsp-windows-amd64.zip -Force
          Compress-Archive -Path tiptop.exe -DestinationPath tiptop-windows-amd64.zip -Force
          Get-ChildItem

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zed-bdl-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------- 发布 Release
  release:
    name: 发布 Release
    needs: [prepare, wasm, build]
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # merge-multiple: true 会把所有 artifact 的内容**平铺**到 dist/ 下
      # （同名文件互相覆盖；BUILD-INFO.json 只有一份，不存在覆盖）。
      # 上传时都摊平了（见 wasm job 的"整理上传内容"），所以这里直接是平铺的。
      - name: 整理产物
        shell: bash
        working-directory: dist
        run: |
          set -eux
          ls -l
          # 四个平台的两个后端二进制必须都在（少一个就红，别让 Release 静默缺件）
          missing=""
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              case "$os-$arch" in
                linux-arm64|windows-arm64) continue ;;  # 这两个组合没有产物
              esac
              ext=tar.gz; [ "$os" = "windows" ] && ext=zip
              for name in "bdl-lsp-$os-$arch.$ext" "tiptop-$os-$arch.$ext"; do
                [ -f "$name" ] || missing="$missing $name"
              done
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少发布产物：$missing"
            exit 1
          fi
          test -f zed-bdl.wasm
          test -f BUILD-INFO.json
          # BUILD-INFO.json 必须合法
          python3 -c "import json;json.load(open('BUILD-INFO.json'))"
          ls -l

      - name: 生成 SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -eux
          # 只对发布物求校验和（SHA256SUMS 自身不在内）。
          sha256sum *.tar.gz *.zip *.wasm > SHA256SUMS
          cat SHA256SUMS

      # prerelease：tag 名含 '-'（如 v0.2.0-rc1）即预发布，
      # 这样 /releases/latest 不会把 rc 当成正式版返回给扩展。
      - name: 创建/更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -eux
          args=( "$TAG" --title "$TAG" --generate-notes )
          if [ "$PRERELEASE" = "true" ]; then
            args+=( --prerelease )
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑（例如换后端 ref 重新构建）时补齐/覆盖资产，
            # 不重复创建 Release、也不动 tag。
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.wasm dist/SHA256SUMS dist/BUILD-INFO.json --clobber
          else
            gh release create "${args[@]}" dist/*.tar.gz dist/*.zip dist/*.wasm dist/SHA256SUMS dist/BUILD-INFO.json
          fi
